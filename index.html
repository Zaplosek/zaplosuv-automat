<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Zaplošův automat 🎰</title>
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom,#1a1a1a,#0f0f0f);
    color:#fff;
    text-align:center;
    padding:50px 0;
}
h1 {
    font-size:70px;
    margin-bottom:40px;
    color:#ffcc00;
    text-shadow:4px 4px 10px rgba(0,0,0,0.7);
}
.balance {font-size:32px;margin-bottom:30px;}
.controls {margin-bottom:40px;}
input[type="number"] {
    width:150px;font-size:22px;padding:10px;text-align:center;border:3px solid #888;border-radius:10px;
}
button {
    padding:20px 40px;font-size:28px;border-radius:20px;border:none;cursor:pointer;
    background-color:#ff4500;color:#fff;box-shadow:4px 4px 15px rgba(0,0,0,0.5);
    transition:0.2s;
}
button:hover {background-color:#ff6347;transform:scale(1.1);}
.reels {
    display:grid;
    grid-template-columns:repeat(3,150px);
    grid-gap:20px;
    justify-content:center;
    margin-bottom:40px;
}
.reel {
    width:150px;height:150px;
    border:5px solid #fff;border-radius:15px;
    background-color:#000;
    display:flex;justify-content:center;align-items:center;
    font-size:80px;box-shadow:5px 5px 20px rgba(255,255,255,0.3);
    transition: transform 0.3s, box-shadow 0.3s;
}
.reel.spin {animation:spinAnim 1s ease-in-out infinite;}
@keyframes spinAnim {
    0% {transform:rotateX(0deg) scale(1);}
    50% {transform:rotateX(90deg) scale(1.2);}
    100% {transform:rotateX(180deg) scale(1);}
}
.reel.win {animation:flash 0.4s infinite alternate,bounce 0.6s ease infinite;}
@keyframes flash {from{box-shadow:0 0 40px gold;} to{box-shadow:0 0 100px orange;}}
@keyframes bounce {0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
#result {font-size:36px;font-weight:bold;margin-top:30px;min-height:60px;}
#winImg {
    display:none;
    width:350px;
    border:6px solid gold;
    border-radius:20px;
    position:relative;
}
#winImg.big {
    animation:popFlyBig 1.5s ease forwards;
}
@keyframes popFlyBig {
    0% {transform:scale(0) translateY(0) rotate(0deg); opacity:0;}
    50% {transform:scale(2.5) translateY(-400px) rotate(30deg); opacity:1;}
    70% {transform:scale(2) translateY(-250px) rotate(-15deg);}
    100% {transform:scale(1.5) translateY(0) rotate(0deg); opacity:1;}
}
#winImg.small {animation:popFlySmall 1s ease forwards;}
@keyframes popFlySmall {
    0% {transform:scale(0) translateY(0) rotate(0deg); opacity:0;}
    50% {transform:scale(1.5) translateY(-150px) rotate(15deg); opacity:1;}
    70% {transform:scale(1.2) translateY(-100px) rotate(-10deg);}
    100% {transform:scale(1) translateY(0) rotate(0deg); opacity:1;}
}
</style>
</head>
<body>

<h1>Zaplošův automat 🎰</h1>
<div class="balance">Tvůj zůstatek: <span id="balance">1000</span> Kč</div>
<div class="controls">
<label for="bet">Sázka:</label>
<input type="number" id="bet" value="50" min="1">
</div>

<div class="reels" id="reels">
<div class="reel"></div><div class="reel"></div><div class="reel"></div>
<div class="reel"></div><div class="reel"></div><div class="reel"></div>
<div class="reel"></div><div class="reel"></div><div class="reel"></div>
</div>

<button onclick="spin()">SPIN</button>
<div id="result"></div>
<img id="winImg" src="matyas.jpg">

<script>
let balance = 1000;
const symbols = ["🍒","🍋","🍊","🍉","🍇"];
const winSymbol = "⭐"; // Matyáš
const reels = Array.from(document.querySelectorAll(".reel"));
const winImg = document.getElementById("winImg");

// Funkce pro výběr symbolu s těžšími šancemi
function getRandomSymbol(){
    let r = Math.random();
    if(r < 0.1) return winSymbol; // 10% velká výhra
    if(r < 0.3) return symbols[Math.floor(Math.random()*symbols.length)]; // 20% malé výhry
    return symbols[Math.floor(Math.random()*symbols.length)]; // 70% ostatní symboly
}

function updateBalance(){ document.getElementById("balance").textContent = balance; }

function spin(){
    let bet = parseInt(document.getElementById("bet").value);
    if(!bet || bet <= 0){ alert("Zadej kladnou sázku!"); return; }
    if(bet>balance){ alert("Nemáš dostatek peněz na tuto sázku!"); return; }

    winImg.style.display = "none"; 
    winImg.className="";
    balance -= bet;
    updateBalance();
    document.getElementById("result").textContent = "🎰 SPIN...";

    reels.forEach(r => { r.classList.remove("win"); r.classList.add("spin"); });

    const spinTimes = reels.map(()=>Math.random()*1500 + 1500);
    reels.forEach((reel,index)=>{
        let interval = setInterval(()=>{ reel.textContent=getRandomSymbol(); },60);
        setTimeout(()=>{
            clearInterval(interval);
            reel.textContent=getRandomSymbol();
            reel.classList.remove("spin");
            if(index===reels.length-1) checkResult(bet);
        },spinTimes[index]);
    });
}

function checkResult(bet){
    const grid=[];
    for(let i=0;i<3;i++) grid.push(reels.slice(i*3,i*3+3).map(r=>r.textContent));

    let win=0; 
    const winningReels=[];
    // řádky
    grid.forEach((row,i)=>{
        let counts = {};
        row.forEach(s=>counts[s]=(counts[s]||0)+1);
        for(let key in counts){
            if(key===winSymbol && counts[key]===3){ 
                win+=bet*50; // JACKPOT
                winningReels.push(reels[i*3],reels[i*3+1],reels[i*3+2]);
            } else if(counts[key]>=2){ 
                win+=bet*5; // malé výhry
                row.forEach((s,j)=>{ if(s===key) winningReels.push(reels[i*3+j]); });
            }
        }
    });
    // sloupce
    for(let j=0;j<3;j++){
        let col=[grid[0][j],grid[1][j],grid[2][j]];
        let counts={};
        col.forEach(s=>counts[s]=(counts[s]||0)+1);
        for(let key in counts){
            if(key===winSymbol && counts[key]===3){ 
                win+=bet*50;
                winningReels.push(reels[j],reels[j+3],reels[j+6]);
            } else if(counts[key]>=2){
                win+=bet*5;
                for(let i=0;i<3;i++) if(col[i]===key) winningReels.push(reels[i*3+j]);
            }
        }
    }

    balance+=win;
    updateBalance();

    if(win>0){
        winningReels.forEach(r=>r.classList.add("win"));
        document.getElementById("result").textContent=`🎉 Vyhrál jsi ${win} Kč! 🎉`;
        winImg.style.display = "block"; 
        if(win>=bet*50){
            winImg.className = "big"; // obrovský efekt
        } else {
            winImg.className = "small"; // menší efekt
        }
    } else {
        document.getElementById("result").textContent="😢 Bohužel prohrál jsi.";
        winImg.style.display = "none";
    }
}
</script>

</body>
</html>
